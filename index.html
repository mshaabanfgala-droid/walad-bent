<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ولد بنت — أونلاين</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,Tahoma,sans-serif}
main{max-width:700px;margin:auto;padding:15px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin:12px 0}
h1,h2,h3{margin:5px 0 12px}.muted{color:#666}.status{padding:11px;border-radius:12px;background:#f0f0f0;margin:10px 0}.good{background:#eaf7ed}.bad{background:#fff0f0}
.big{text-align:center;font-size:64px;font-weight:900;margin:8px}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:18px;margin:6px 0}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#222;color:#fff;font-size:18px;font-weight:700;margin-top:8px}button:disabled{opacity:.45}
.alt{background:#eee;color:#222}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-weight:700}
.players div{padding:10px;border-bottom:1px solid #eee}.review{border:1px solid #ddd;border-radius:14px;padding:12px;margin:10px 0}
.answer{padding:10px;background:#f7f7f7;border-radius:10px;margin:6px 0}.voteRow{display:flex;gap:8px}.voteRow button{margin:0;flex:1}.yes{background:#267a3d}.no{background:#a52b2b}
.result{padding:13px;border:1px solid #ddd;border-radius:14px;margin:9px 0}.points{font-size:24px;font-weight:900}.small{font-size:14px}
@media(max-width:430px){.fields{grid-template-columns:1fr}.big{font-size:52px}}
</style>
</head>
<body><main><h1>🎮 ولد بنت — أونلاين</h1><div id="app"></div></main>
<script>
const CATS=[["ولد","boy"],["بنت","girl"],["حيوان","animal"],["جماد","object"],["دولة","country"],["نبات","plant"]];
const LETTERS=["ا","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","ه","و","ي"];
const MAX_PLAYERS=6, ROUND_SECONDS=120, TOTAL_ROUNDS=5;
let peer=null,myId="",hostId="",hostConn=null,isHost=false,room="",name="";
let phase="lobby",round=0,letter="",timerEnd=0,timerInt=null;
let answers=emptyAnswers(),players={},scores={},myVotes={},usedLetters=[];

const app=document.getElementById("app");
const qs=new URLSearchParams(location.search);
const linkRoom=(qs.get("room")||"").toUpperCase();

function emptyAnswers(){return {boy:"",girl:"",animal:"",object:"",country:"",plant:""}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function norm(s){return String(s||"").trim().replace(/\s+/g," ").toLowerCase()}
function firstLetter(s){s=String(s||"").trim();if(!s)return"";return "أإآ".includes(s[0])?"ا":s[0]}
function validAnswer(v){return norm(v)!==""&&firstLetter(v)===letter}
function allFilled(a){return CATS.every(c=>norm(a[c[1]])!=="")}
function ttext(ms){let s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60),x=s%60;return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}

function renderLobby(msg=""){
app.innerHTML=`<div class="card"><h2>👑 إنشاء لعبة</h2><input id="cn" placeholder="اسمك"><button id="create">إنشاء غرفة</button></div>
<div class="card"><h2>👤 دخول لعبة</h2><input id="jn" placeholder="اسمك"><input id="rc" placeholder="كود الغرفة" value="${esc(linkRoom)}">
<div class="muted small">لو فتحت رابط دعوة، كود الغرفة يظهر تلقائيًا.</div><button id="join">دخول الغرفة</button></div>
${msg?`<div class="status bad">${esc(msg)}</div>`:""}`;
document.getElementById("create").onclick=createRoom;document.getElementById("join").onclick=joinRoom;
}
function newPeer(isCreatingHost=false){
  peer=isCreatingHost ? new Peer("WB-"+room) : new Peer();
  peer.on("open",id=>{
    myId=id;
    if(isHost) hostReady();
    else connectToHost();
  });
  peer.on("connection",conn=>{
    if(isHost) setupHostConnection(conn);
  });
  peer.on("error",e=>{
    let m=e?.type||"network";
    if(phase==="lobby"){
      if(isHost) renderHostLobby("خطأ في الاتصال: "+m+" — لو الكود مستخدم، اعمل غرفة جديدة.");
      else renderLobby("تعذر الاتصال: "+m);
    }
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
}
function createRoom(){
  name=document.getElementById("cn").value.trim();
  if(!name)return alert("اكتب اسمك أولًا.");
  isHost=true;
  room=Math.random().toString(36).slice(2,7).toUpperCase();
  hostId="WB-"+room;
  round=0;scores={};players={};usedLetters=[];phase="lobby";
  newPeer(true);
}
function hostReady(){
  players[myId]={id:myId,name,answers:emptyAnswers(),stopped:false,conn:null,votes:{},reviewSubmitted:false};
  renderHostLobby();
}
function joinRoom(){
  name=document.getElementById("jn").value.trim();
  room=document.getElementById("rc").value.trim().toUpperCase();
  if(!name)return alert("اكتب اسمك أولًا.");
  if(!room)return alert("اكتب كود الغرفة.");
  hostId="WB-"+room;
  isHost=false;phase="lobby";
  newPeer(false);
}
function connectToHost(){
hostConn=peer.connect(hostId,{reliable:true});
hostConn.on("open",()=>hostConn.send({type:"JOIN",from:myId,name,room}));
hostConn.on("data",handleMessage);hostConn.on("close",()=>{if(phase!=="results"&&phase!=="final")renderJoinLobby("انقطع الاتصال بصاحب الغرفة.")});
}
function setupHostConnection(conn){
conn.on("open",()=>{});
conn.on("data",m=>handleHostMessage(m,conn));
conn.on("close",()=>{let p=Object.values(players).find(x=>x.conn===conn);if(p)p.conn=null;});
}
function handleHostMessage(m,conn){
if(m.type==="JOIN"){
if(m.room!==room)return;
if(Object.keys(players).length>=MAX_PLAYERS)return;
if(players[m.from])return;
players[m.from]={id:m.from,name:m.name,answers:emptyAnswers(),stopped:false,conn:conn,votes:{},reviewSubmitted:false};
conn.send({type:"WELCOME",hostId,room,players:publicPlayers(),scores,usedLetters,phase,round,letter,timerEnd});
	broadcastPlayers();renderHostLobby();return;
}
if(!players[m.from])return;
if(m.type==="SYNC"&&phase==="play"){players[m.from].answers={...m.answers};return}
if(m.type==="STOP"&&phase==="play"){
players[m.from].answers={...m.answers};players[m.from].stopped=true;beginReview("استوب");return;
}
if(m.type==="VOTES"&&phase==="review"){
players[m.from].votes=m.votes||{};players[m.from].reviewSubmitted=true;checkReviews();return;
}
if(m.type==="REOPEN_REVIEW"&&phase==="review"){
players[m.from].votes={};players[m.from].reviewSubmitted=false;checkReviews();return;
}
}
function publicPlayers(){return Object.values(players).map(p=>({id:p.id,name:p.name,answers:p.answers||emptyAnswers(),stopped:!!p.stopped}))}
function broadcast(m){Object.values(players).forEach(p=>{if(p.conn?.open)p.conn.send(m)})}
function broadcastPlayers(){broadcast({type:"PLAYERS",players:publicPlayers()})}
async function shareRoom(){
  let u=location.origin+location.pathname+"?room="+encodeURIComponent(room);
  if(navigator.share){
    try{await navigator.share({title:"ولد بنت",text:"ادخل لعبة ولد بنت من الرابط ده",url:u});return}catch(e){}
  }
  try{await navigator.clipboard.writeText(u);alert("تم نسخ رابط الغرفة.")}catch(e){prompt("انسخ الرابط:",u)}
}
function renderHostLobby(msg=""){
app.innerHTML=`<div class="card"><h2>🏠 غرفة اللعبة</h2><div class="big" style="font-size:46px">${esc(room)}</div>
<div class="status good">${esc(msg||"الغرفة جاهزة. ابعت رابط الدعوة.")}</div><button id="share">🔗 مشاركة رابط الغرفة</button></div>
<div class="card"><h2>👥 اللاعبين (${Object.keys(players).length}/${MAX_PLAYERS})</h2><div class="players">${Object.values(players).map(p=>`<div>🟢 ${esc(p.name)}</div>`).join("")}</div>
<button id="start" ${Object.keys(players).length<1?"disabled":""}>ابدأ الجولة الأولى</button></div>`;
document.getElementById("share").onclick=shareRoom;document.getElementById("start").onclick=startRound;
}
function renderJoinLobby(msg=""){
app.innerHTML=`<div class="card"><h2>🏠 الغرفة: ${esc(room)}</h2><div class="status good">${esc(msg)}</div></div>
<div class="card"><h2>👥 اللاعبين</h2><div class="players">${Object.values(players).map(p=>`<div>🟢 ${esc(p.name)}</div>`).join("")}</div></div>`;
}
function startRound(){
if(!isHost)return;
round++;
let remaining=LETTERS.filter(l=>!usedLetters.includes(l));
if(!remaining.length) { usedLetters=[]; remaining=[...LETTERS]; }
letter=remaining[Math.floor(Math.random()*remaining.length)];
usedLetters.push(letter);
phase="play";timerEnd=Date.now()+ROUND_SECONDS*1000;
answers=emptyAnswers();Object.values(players).forEach(p=>{p.answers=emptyAnswers();p.stopped=false;p.votes={};p.reviewSubmitted=false});
renderPlay();broadcast({type:"START",round,letter,timerEnd,usedLetters});startTimer();
}
function startTimer(){
clearInterval(timerInt);timerInt=setInterval(()=>{let left=Math.max(0,timerEnd-Date.now()),el=document.getElementById("timer");if(el)el.textContent=ttext(left);
if(left<=0){clearInterval(timerInt);if(isHost)beginReview("انتهى الوقت")}},200);
}
function renderPlay(){
app.innerHTML=`<div class="card"><div>الجولة ${round} من ${TOTAL_ROUNDS}</div><div class="big">${esc(letter)}</div>
<div id="timer" class="status" style="text-align:center;font-size:30px;font-weight:900">${ttext(timerEnd-Date.now())}</div>
<div class="status">املأ الـ6 خانات. أول لاعب يخلص يضغط استوب.</div></div>
<div class="card"><div class="fields">${CATS.map(c=>`<div class="field"><label>${c[0]}</label><input data-k="${c[1]}" placeholder="${c[0]}"></div>`).join("")}</div>
<button id="stop" class="alt" disabled>🛑 استوب</button></div>`;
document.querySelectorAll("[data-k]").forEach(i=>i.oninput=()=>{answers[i.dataset.k]=i.value;document.getElementById("stop").disabled=!allFilled(answers);
if(isHost)players[myId].answers={...answers};else hostConn?.send({type:"SYNC",from:myId,answers:{...answers}})});
document.getElementById("stop").onclick=()=>{if(!allFilled(answers))return;if(isHost){players[myId].answers={...answers};players[myId].stopped=true;beginReview("استوب")}else hostConn?.send({type:"STOP",from:myId,answers:{...answers}})};
startTimer();
}
function beginReview(reason){
if(!isHost||phase!=="play")return;phase="review";clearInterval(timerInt);players[myId].answers={...answers};players[myId].stopped=true;
Object.values(players).forEach(p=>{p.reviewSubmitted=false;p.votes={}});renderReview();broadcast({type:"REVIEW",round,letter,players:publicPlayers(),reason});
}
function renderReview(){
myVotes={};
let others=Object.values(players).filter(p=>p.id!==myId);
let submitted=isHost ? !!players[myId]?.reviewSubmitted : false;

app.innerHTML=`<div class="card"><h2>📝 مراجعة الإجابات</h2>
<div class="status">راجع إجابات اللاعبين الآخرين. لازم تختار <b>صح أو غلط لكل خانة</b> قبل إرسال المراجعة.</div>
<div id="reviewProgress" class="status">0 من ${others.length*CATS.length} إجابة تم تقييمها</div></div>
${others.map(p=>`<div class="review"><h3>🧑 ${esc(p.name)}</h3>${CATS.map(c=>`<div class="answer"><b>${c[0]}:</b> ${esc(p.answers?.[c[1]]||"—")}
<div class="voteRow"><button class="yes" data-p="${p.id}" data-k="${c[1]}" data-v="1">✅ صح</button><button class="no" data-p="${p.id}" data-k="${c[1]}" data-v="0">❌ غلط</button></div></div>`).join("")}</div>`).join("")}
<button id="submit">إرسال المراجعة</button>`;

function refreshProgress(){
let done=0,total=others.length*CATS.length;
document.querySelectorAll("[data-p]").forEach(b=>{
  let p=b.dataset.p,k=b.dataset.k;
  if(myVotes[p]&&Object.prototype.hasOwnProperty.call(myVotes[p],k)){
    done++;
    let val=myVotes[p][k];
    b.parentElement.querySelectorAll("button").forEach(x=>x.style.opacity=".45");
    let selected=b.parentElement.querySelector(`[data-v="${val?"1":"0"}"]`);
    if(selected)selected.style.opacity="1";
  }
});
let pr=document.getElementById("reviewProgress");
if(pr)pr.textContent=`${done} من ${total} إجابة تم تقييمها`;
let submit=document.getElementById("submit");
if(submit)submit.disabled=(done!==total);
}

document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
  let p=b.dataset.p,k=b.dataset.k;
  if(!myVotes[p])myVotes[p]={};
  myVotes[p][k]=b.dataset.v==="1";
  refreshProgress();
});

document.getElementById("submit").onclick=()=>{
  let total=others.length*CATS.length;
  let done=Object.values(myVotes).reduce((n,x)=>n+Object.keys(x).length,0);
  if(done!==total){alert("لازم تقيّم كل الإجابات أولًا.");return;}
  if(isHost){
    players[myId].votes=myVotes;
    players[myId].reviewSubmitted=true;
    renderWaiting(true);
    checkReviews();
  }else{
    hostConn?.send({type:"VOTES",from:myId,votes:myVotes});
    renderWaiting(true);
  }
};
refreshProgress();
}
function renderWaiting(canReset=false){
app.innerHTML=`<div class="card"><h2>⏳ تم إرسال المراجعة</h2>
<div class="status good">تم تقييم كل الإجابات. في انتظار باقي اللاعبين.</div>
${canReset?`<button id="resetReview" class="alt">🔄 إعادة التقييم</button>`:""}</div>`;
if(canReset)document.getElementById("resetReview").onclick=()=>{
  if(isHost){
    players[myId].reviewSubmitted=false;
    players[myId].votes={};
    renderReview();
    checkReviews();
  }else{
    hostConn?.send({type:"REOPEN_REVIEW",from:myId});
    renderReview();
  }
};
}

function checkReviews(){
if(!isHost)return;let ps=Object.values(players);
if(!ps.every(p=>p.reviewSubmitted)){renderHostWait();return}
calculateResults();
}
function renderHostWait(){app.innerHTML=`<div class="card"><h2>⏳ في انتظار المراجعات</h2><div class="status">تمت مراجعة ${Object.values(players).filter(p=>p.reviewSubmitted).length} من ${Object.keys(players).length} لاعبين.</div></div>`}
function calculateResults(){
let ps=Object.values(players),accepted={};ps.forEach(p=>accepted[p.id]={});
CATS.forEach(([label,k])=>ps.forEach(target=>{
let v=norm(target.answers?.[k]),ok=false;
if(v&&validAnswer(target.answers?.[k])){
let yes=0,no=0;
ps.forEach(reviewer=>{if(reviewer.id===target.id)return;let val=reviewer.votes?.[target.id]?.[k];if(val===true)yes++;if(val===false)no++});
if(ps.length===1)ok=true;else ok=yes>no;
}
accepted[target.id][k]=ok;
}));
let result={};ps.forEach(p=>{let total=0,fields={};CATS.forEach(([label,k])=>{
if(!accepted[p.id][k]){fields[k]=0;return}
let v=norm(p.answers?.[k]),same=ps.filter(q=>accepted[q.id][k]&&norm(q.answers?.[k])===v).length;fields[k]=same===1?10:5;total+=fields[k]
});scores[p.id]=(scores[p.id]||0)+total;result[p.id]={id:p.id,name:p.name,total,fields,answers:p.answers}});
phase="results";renderResults(result);broadcast({type:"RESULTS",round,letter,result,scores});
}
function renderResults(result){
  let cards=Object.values(result).map(r=>{
    let details=CATS.map(c=>`${c[0]}: ${esc(r.answers?.[c[1]]||"—")} (${r.fields[c[1]]||0})`).join(" · ");
    return `<div class="result"><b>${esc(r.name)}</b> — <span class="points">+${r.total}</span> نقطة<br><span class="small">${details}</span></div>`;
  }).join("");
  let nextHtml=isHost
    ? `<button id="next">${round<TOTAL_ROUNDS?"الجولة التالية ➜":"إنهاء اللعبة 🏁"}</button>`
    : `<div class="status">في انتظار صاحب الغرفة.</div>`;
  app.innerHTML=`<div class="card"><h2>🏆 نتيجة الجولة</h2><div class="status">الحرف: <b>${esc(letter)}</b></div></div>${cards}${nextHtml}`;
  if(isHost)document.getElementById("next").onclick=()=>round<TOTAL_ROUNDS?startRound():showFinal();
}
function showFinal(){phase="final";app.innerHTML=`<div class="card"><h2>🏁 النتيجة النهائية</h2>${Object.values(players).sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0)).map(p=>`<div class="result"><b>${esc(p.name)}</b> — <span class="points">${scores[p.id]||0}</span> نقطة</div>`).join("")}</div>`;broadcast({type:"FINAL",scores})}
function handleMessage(m){
if(m.type==="WELCOME"){hostId=m.hostId;room=m.room;players={};m.players.forEach(p=>players[p.id]={...p,conn:null});scores=m.scores||{};usedLetters=m.usedLetters||[];renderJoinLobby("تم الاتصال بالغرفة. في انتظار بدء الجولة.");return}
if(m.type==="PLAYERS"){players={};m.players.forEach(p=>players[p.id]={...p,conn:null});if(phase==="lobby")renderJoinLobby("تم تحديث قائمة اللاعبين.");return}
if(m.type==="START"){round=m.round;letter=m.letter;timerEnd=m.timerEnd;usedLetters=m.usedLetters||usedLetters;phase="play";answers=emptyAnswers();renderPlay();return}
if(m.type==="REVIEW"){players={};m.players.forEach(p=>players[p.id]={...p,conn:null});round=m.round;letter=m.letter;phase="review";renderReview();return}
if(m.type==="RESULTS"){scores=m.scores||scores;round=m.round;letter=m.letter;phase="results";renderResults(m.result);return}
if(m.type==="FINAL"){scores=m.scores||scores;phase="final";renderFinalFromScores();return}
}
function renderFinalFromScores(){app.innerHTML=`<div class="card"><h2>🏁 النتيجة النهائية</h2>${Object.values(players).sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0)).map(p=>`<div class="result"><b>${esc(p.name)}</b> — <span class="points">${scores[p.id]||0}</span> نقطة</div>`).join("")}</div>`}
renderLobby();
</script></body></html>
